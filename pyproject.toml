[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailtriage"
version = "0.1.0"
description = "Offline AWS CloudTrail triage for identity-based attacks: single-event signals plus time-bounded multi-stage chain correlation. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harry Chavada" }]
keywords = ["cloudtrail", "aws", "security", "dfir", "blue-team", "incident-response", "threat-detection", "soc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
trailtriage = "trailtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
